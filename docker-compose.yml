# Masažo Gurmanai — vietinė WordPress + Elementor aplinka.
#
# Paleidimas:  ./skriptai/paleisti.sh   (arba dukart spustelėkite PALEISTI.command)
# Stabdymas:   docker compose down      (duomenys lieka)
#
# SVARBU: `name` nurodytas aiškiai — kitaip Docker Compose projekto pavadinimą imtų
# iš katalogo vardo ir galėtų susikirsti su kitais šios mašinos projektais.
#
# PHP 8.5 pasirinkta sąmoningai: tikrasis masazogurmanai.lt serveris veikia su PHP 8.5.
name: masazogurmanai

services:
  db:
    image: mariadb:11
    container_name: mg_db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  wp:
    image: wordpress:php8.5-apache
    container_name: mg_wp
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WP_PORT}:80"
    environment: &wpenv
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_DEBUG: 1
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', true);
        define('WP_ENVIRONMENT_TYPE', 'local');
        define('WP_MEMORY_LIMIT', '512M');
        define('AUTOMATIC_UPDATER_DISABLED', true);
    volumes: &wpvol
      - wp_core:/var/www/html
      - ./wp-content/themes/masazo-gurmanai:/var/www/html/wp-content/themes/masazo-gurmanai
      - ./skriptai:/skriptai:ro
      - ./php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
      - ./apache/00-docker-mount.conf:/etc/apache2/conf-enabled/00-docker-mount.conf:ro

  # WP-CLI — naudojamas tik komandoms (pats nieko neaptarnauja)
  cli:
    image: wordpress:cli-php8.5
    container_name: mg_cli
    depends_on:
      - wp
    user: "33:33"
    entrypoint: ["tail", "-f", "/dev/null"]
    environment:
      <<: *wpenv
      WP_CLI_CACHE_DIR: /tmp/wp-cli-cache
    volumes:
      - wp_core:/var/www/html
      - ./wp-content/themes/masazo-gurmanai:/var/www/html/wp-content/themes/masazo-gurmanai
      - ./skriptai:/skriptai:ro
      # WP-CLI archyvas pats meta „Deprecated“ su PHP 8.5 — CLI lange jų nerodome
      - ./php/cli.ini:/usr/local/etc/php/conf.d/cli.ini:ro

volumes:
  db_data:
  wp_core:
