; Didesni failai Media bibliotekoje (nuotraukos)
upload_max_filesize = 64M
post_max_size = 64M
memory_limit = 512M
max_execution_time = 300
; Vietinėje aplinkoje rodome VISAS klaidas ir įspėjimus (tikrame serveryje veikia PHP 8.5
; su įjungtu klaidų rodymu, todėl tema privalo neišmesti nė vieno „Deprecated“).
error_reporting = E_ALL
display_errors = On
